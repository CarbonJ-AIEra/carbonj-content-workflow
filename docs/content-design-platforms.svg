<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">CarbonJ Content Design 多平台文案示意图</title>
  <desc id="desc">视频事实底稿被分别改写为小红书、抖音、B站、视频号、X、YouTube 和公众号的原生文案。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faf7"/><stop offset="1" stop-color="#eff4ed"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#324333" flood-opacity=".09"/></filter>
    <style>.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}.h{font-size:25px;font-weight:750;fill:#202b22}.sub{font-size:15px;fill:#647064}.platform{font-size:16px;font-weight:750;fill:#334334}.meta{font-size:12px;font-weight:700;letter-spacing:.8px;fill:#869186}.line{stroke:#dfe6dc;stroke-width:1.5}</style>
  </defs>
  <rect width="1200" height="660" rx="28" fill="url(#bg)"/>
  <text x="54" y="58" class="sans meta">ONE SOURCE · NATIVE PLATFORM COPY</text>
  <text x="54" y="99" class="sans h">同一份内容底稿，分别写成平台自己的语言</text>
  <text x="54" y="129" class="sans sub">先核实视频讲了什么，再决定每个平台如何呈现；不是把同一段文案复制七遍。</text>
  <g filter="url(#s)">
    <rect x="54" y="181" width="254" height="414" rx="22" fill="#263329"/>
    <rect x="78" y="207" width="44" height="44" rx="14" fill="#b1e36b"/><path d="M90 219h20M90 227h17M90 235h14" stroke="#35502c" stroke-width="2.5" stroke-linecap="round"/>
    <text x="136" y="225" class="sans" fill="#d7efbb" font-size="12" font-weight="700">SOURCE BRIEF</text>
    <text x="136" y="245" class="sans" fill="#fff" font-size="16" font-weight="700">视频事实底稿</text>
    <text x="80" y="296" class="sans" fill="#fff" font-size="22" font-weight="750">AI 笔记怎么整理？</text>
    <path d="M80 316h202" stroke="#566458"/>
    <text x="80" y="350" class="sans" fill="#d8e0d6" font-size="14">01  核心问题与受众</text>
    <text x="80" y="382" class="sans" fill="#d8e0d6" font-size="14">02  实际操作步骤</text>
    <text x="80" y="414" class="sans" fill="#d8e0d6" font-size="14">03  效果与证据边界</text>
    <text x="80" y="446" class="sans" fill="#d8e0d6" font-size="14">04  搜索词与关键主题</text>
    <rect x="80" y="492" width="202" height="68" rx="13" fill="#35453a"/>
    <text x="98" y="519" class="sans" fill="#bfe789" font-size="12" font-weight="700">FACT CHECK</text>
    <text x="98" y="543" class="sans" fill="#e9eee6" font-size="13">不补编视频没有的信息</text>
  </g>
  <path d="M326 389h45" stroke="#8ea08c" stroke-width="2.5"/><path d="m362 381 12 8-12 8" fill="none" stroke="#8ea08c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#s)">
    <rect x="390" y="181" width="756" height="414" rx="22" fill="#fff" stroke="#e1e8de"/>
    <text x="420" y="222" class="sans meta">PLATFORM ADAPTATION</text>
    <text x="420" y="252" class="sans" fill="#263329" font-size="18" font-weight="700">按搜索习惯、内容长度与表达场景逐个平台调整</text>
    <g>
      <rect x="420" y="284" width="216" height="118" rx="16" fill="#fff6f2"/><circle cx="444" cy="309" r="8" fill="#fa7c62"/><text x="462" y="314" class="sans platform">小红书</text><text x="440" y="345" class="sans meta">搜索标题 + 正文</text><text x="440" y="374" class="sans" fill="#5d695d" font-size="13">问题词 · 场景 · 话题</text>
      <rect x="660" y="284" width="216" height="118" rx="16" fill="#f4f7ff"/><circle cx="684" cy="309" r="8" fill="#4d75e8"/><text x="702" y="314" class="sans platform">抖音</text><text x="680" y="345" class="sans meta">短标题 + 话题</text><text x="680" y="374" class="sans" fill="#5d695d" font-size="13">一句话讲清冲突或结果</text>
      <rect x="900" y="284" width="216" height="118" rx="16" fill="#f3f8ff"/><circle cx="924" cy="309" r="8" fill="#43a0d5"/><text x="942" y="314" class="sans platform">B 站</text><text x="920" y="345" class="sans meta">完整标题 + 简介</text><text x="920" y="374" class="sans" fill="#5d695d" font-size="13">教程意图 · 观看收益</text>
      <rect x="420" y="424" width="216" height="118" rx="16" fill="#f3faf4"/><circle cx="444" cy="449" r="8" fill="#27a16e"/><text x="462" y="454" class="sans platform">视频号</text><text x="440" y="485" class="sans meta">短标题 + 结构化简介</text><text x="440" y="514" class="sans" fill="#5d695d" font-size="13">核心理论 · 内容脉络</text>
      <rect x="660" y="424" width="216" height="118" rx="16" fill="#f5f5f5"/><circle cx="684" cy="449" r="8" fill="#323232"/><text x="702" y="454" class="sans platform">X</text><text x="680" y="485" class="sans meta">观点短帖</text><text x="680" y="514" class="sans" fill="#5d695d" font-size="13">发现 · 反差 · 简洁表达</text>
      <rect x="900" y="424" width="216" height="118" rx="16" fill="#fff8ed"/><circle cx="924" cy="449" r="8" fill="#f3a23a"/><text x="942" y="454" class="sans platform">YouTube / 公众号</text><text x="920" y="485" class="sans meta">描述 / 完整文章</text><text x="920" y="514" class="sans" fill="#5d695d" font-size="13">章节元数据 · 独立阅读</text>
    </g>
    <text x="420" y="572" class="sans" fill="#667566" font-size="13">默认交付完整预览：逐项检查标题、正文、标签和事实后再用于发布。</text>
  </g>
</svg>
