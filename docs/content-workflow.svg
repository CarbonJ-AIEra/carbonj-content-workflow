<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">CarbonJ 自媒体内容工作流</title>
  <desc id="desc">从视频和字幕出发，整理事实底稿，生成平台文案和封面，并延展为可编辑 HTML 讲解材料。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f9f6"/><stop offset="1" stop-color="#f4f1e9"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8f2a6"/><stop offset="1" stop-color="#a6d95e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#263329" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#809080" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}.title{font-size:30px;font-weight:750;fill:#1c2821}.label{font-size:16px;font-weight:700;fill:#4b5a4c}.body{font-size:15px;fill:#6b776b}.small{font-size:13px;font-weight:700;letter-spacing:1px;fill:#7c8a7c}.card{fill:#fff;stroke:#e4e8df;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <text x="56" y="61" class="sans small">FROM ONE VIDEO TO A CONTENT SYSTEM</text>
  <text x="56" y="105" class="sans title" font-size="27">一次拍摄，多种内容资产；一个主题，贯穿所有表达</text>

  <g filter="url(#shadow)">
    <rect x="56" y="180" width="210" height="190" rx="20" class="card"/>
    <rect x="56" y="180" width="210" height="8" rx="4" fill="#222d25"/>
    <circle cx="161" cy="236" r="29" fill="#edf2e9"/><path d="M151 220v32l26-16z" fill="#486449"/>
    <text x="161" y="291" text-anchor="middle" class="sans title" font-size="20">视频素材</text>
    <text x="161" y="322" text-anchor="middle" class="sans body">视频 + 字幕 / 口播稿</text>
    <text x="161" y="348" text-anchor="middle" class="sans body" font-size="13">内容事实与画面证据</text>
  </g>
  <path d="M278 275h60" stroke="#809080" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="354" y="180" width="250" height="190" rx="20" class="card"/>
    <rect x="354" y="180" width="250" height="8" rx="4" fill="#9bd547"/>
    <rect x="382" y="211" width="48" height="48" rx="14" fill="url(#green)"/>
    <path d="M394 226h24M394 234h18M394 242h21" stroke="#36502e" stroke-width="2.5" stroke-linecap="round"/>
    <text x="447" y="238" class="sans label" font-size="18">03 · Content Design</text>
    <text x="479" y="292" text-anchor="middle" class="sans title" font-size="21">事实底稿 → 平台表达</text>
    <text x="479" y="325" text-anchor="middle" class="sans body">标题 · 正文 · 标签 · 内容预览</text>
    <text x="479" y="350" text-anchor="middle" class="sans body" font-size="13">小红书 / 抖音 / B站 / 视频号…</text>
  </g>
  <path d="M616 275h55" stroke="#809080" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M682 275v-96h36M682 275v96h36" fill="none" stroke="#a4b1a3" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="730" y="118" width="390" height="145" rx="20" class="card"/>
    <rect x="730" y="118" width="8" height="145" rx="4" fill="#f1a17a"/>
    <rect x="762" y="146" width="56" height="74" rx="9" fill="#f8e4d9"/>
    <rect x="770" y="154" width="40" height="58" rx="5" fill="#fff"/><path d="M776 170h28M776 178h21M776 187h25" stroke="#df8860" stroke-width="3" stroke-linecap="round"/>
    <text x="844" y="164" class="sans small">02 · CARBONJ COVER</text>
    <text x="844" y="197" class="sans title" font-size="21">确认标题 + 视频画面</text>
    <text x="844" y="228" class="sans body">生成适配平台的多尺寸封面</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="730" y="286" width="390" height="145" rx="20" class="card"/>
    <rect x="730" y="286" width="8" height="145" rx="4" fill="#7b91ad"/>
    <rect x="762" y="314" width="56" height="74" rx="9" fill="#e7edf3"/>
    <path d="M772 326h35v49h-35z" fill="#fff" stroke="#aebdca"/><path d="M778 337h23M778 345h23M778 353h17" stroke="#6f89a5" stroke-width="2" stroke-linecap="round"/><path d="m786 366 5 4 8-9" fill="none" stroke="#66a274" stroke-width="2.5"/>
    <text x="844" y="332" class="sans small">01 · CARBONJ SVG HTML</text>
    <text x="844" y="365" class="sans title" font-size="21">把主题展开讲清楚</text>
    <text x="844" y="396" class="sans body">可编辑长页面 / PPT 式讲解材料</text>
  </g>
  <path d="M1120 190h27v143h-27" fill="none" stroke="#809080" stroke-width="2"/>
  <rect x="930" y="459" width="190" height="48" rx="24" fill="#263329"/>
  <text x="1025" y="489" text-anchor="middle" class="sans" fill="#fff" font-size="15" font-weight="700">复核后发布 / 分享</text>
  <text x="56" y="493" class="sans body" font-size="14">按需组合：内容文案和封面用于分发，HTML / PPT 用于解释、复盘与长期沉淀。</text>
</svg>
